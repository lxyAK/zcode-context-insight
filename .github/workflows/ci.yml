name: CI

# 仓库护栏：push / PR 时全量验证（构建 + 类型 + 测试）
# 宿主数据相关测试依赖 Git Bash 与 Windows 路径约定，runner 固定 windows-latest
on: [push, pull_request]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm test
